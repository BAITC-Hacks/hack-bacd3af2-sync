services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: windai-backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: WindAI
      ENV: production
      CORS_ORIGINS: http://localhost:5173
      # Values come from the shell or from a root .env file (see .env.example; never committed).
      MODEL_ADAPTER: ${MODEL_ADAPTER:-real}  # real = ML team's CatBoost models (bundled in the image)
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open_meteo}  # falls back to synthetic weather if offline
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}  # empty → template explanation instead of the LLM
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EXPLANATION_LANGUAGE: ${EXPLANATION_LANGUAGE:-ru}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    container_name: windai-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
